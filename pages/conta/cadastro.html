<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro — Portal de Notícias</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Literata:opsz,wght@7..72,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C2B33'/%3E%3Ccircle cx='16' cy='20' r='9' fill='%23FFD21F'/%3E%3Crect y='20' width='32' height='12' fill='%230C2B33'/%3E%3Crect y='20' width='32' height='3' fill='%23F3FBFA'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../assets/css/identidade.css" />
    <link rel="stylesheet" href="../../assets/css/animacoes.css" />
    <script src="../../assets/js/edicao.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="back-link" href="../../index.html">← Voltar ao portal</a>
      <section class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true"></span
          ><span class="brand-word">correio<b>digital</b></span>
        </div>
        <h1>Criar conta</h1>
        <p>Cadastro local para demonstração do projeto.</p>
        <form id="registerForm">
          <label>Nome<input id="name" required /></label
          ><label>E-mail<input id="email" type="email" required /></label
          ><label
            >Senha<input
              id="password"
              type="password"
              minlength="6"
              required /></label
          ><button class="primary-btn">Cadastrar</button>
          <p id="msg" class="form-msg"></p>
        </form>
        <p class="auth-switch">
          Já possui conta? <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>
    <script src="../../assets/js/auth.js"></script>
    <script>
      document.querySelector("#registerForm").onsubmit = (e) => {
        e.preventDefault();
        const users = getUsers(),
          mail = email.value.trim().toLowerCase();
        if (users.some((u) => u.email === mail)) {
          msg.textContent = "Este e-mail já está cadastrado.";
          return;
        }
        users.push({
          name: name.value.trim(),
          email: mail,
          password: password.value,
          role: "user",
        });
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
        msg.textContent = "Cadastro realizado. Redirecionando...";
        setTimeout(() => (location.href = "login.html"), 700);
      };
    </script>
    <script src="../../assets/js/animacoes.js"></script>
  </body>
</html>
