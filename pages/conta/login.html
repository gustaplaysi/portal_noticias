<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Portal de Notícias</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Literata:opsz,wght@7..72,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C2B33'/%3E%3Ccircle cx='16' cy='20' r='9' fill='%23FFD21F'/%3E%3Crect y='20' width='32' height='12' fill='%230C2B33'/%3E%3Crect y='20' width='32' height='3' fill='%23F3FBFA'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../assets/css/identidade.css" />
    <link rel="stylesheet" href="../../assets/css/animacoes.css" />
    <script src="../../assets/js/edicao.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="back-link" href="../../index.html">← Voltar ao portal</a>
      <section class="auth-card">
        <div class="auth-brand">
          <span class="brand-mark" aria-hidden="true"></span
          ><span class="brand-word">correio<b>digital</b></span>
        </div>
        <h1>Entrar</h1>
        <p>Acesse sua conta de leitor.</p>
        <form id="loginForm">
          <label
            >E-mail<input
              id="email"
              type="email"
              required
              placeholder="usuario@demo.com" /></label
          ><label
            >Senha<input
              id="password"
              type="password"
              required
              placeholder="123456" /></label
          ><button class="primary-btn">Entrar</button>
          <p id="msg" class="form-msg"></p>
        </form>
        <div class="demo-credentials">
          <strong>Acesso de teste</strong><span>usuario@demo.com / 123456</span>
        </div>
        <p class="auth-switch">
          Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a>
        </p>
        <p class="auth-switch">
          Administrador? <a href="../admin/cms-admin.html">Acessar CMS</a>
        </p>
      </section>
    </main>
    <script src="../../assets/js/auth.js"></script>
    <script>
      getUsers();
      document.querySelector("#loginForm").onsubmit = (e) => {
        e.preventDefault();
        const u = getUsers().find(
          (x) =>
            x.email === email.value.trim().toLowerCase() &&
            x.password === password.value &&
            x.role === "user",
        );
        if (!u) {
          msg.textContent = "E-mail ou senha inválidos.";
          return;
        }
        setSession(u);
        location.href = "../../index.html";
      };
    </script>
    <script src="../../assets/js/animacoes.js"></script>
  </body>
</html>
