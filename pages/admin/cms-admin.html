<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CMS Admin — Portal de Notícias</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Literata:opsz,wght@7..72,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C2B33'/%3E%3Ccircle cx='16' cy='20' r='9' fill='%23FFD21F'/%3E%3Crect y='20' width='32' height='12' fill='%230C2B33'/%3E%3Crect y='20' width='32' height='3' fill='%23F3FBFA'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../../assets/css/identidade.css" />
    <link rel="stylesheet" href="../../assets/css/animacoes.css" />
    <script src="../../assets/js/edicao.js"></script>
  </head>
  <body class="admin-page">
    <div id="adminLogin" class="auth-shell">
      <a class="back-link" href="../../index.html">← Voltar ao portal</a>
      <section class="auth-card">
        <div class="auth-brand"><b>CMS</b><span>ADMIN • DEMO</span></div>
        <h1>Painel administrativo</h1>
        <p>Entre para gerenciar as notícias e suas imagens.</p>
        <form id="adminLoginForm">
          <label
            >E-mail<input
              id="adminEmail"
              type="email"
              value="admin@demo.com"
              required /></label
          ><label
            >Senha<input
              id="adminPassword"
              type="password"
              value="admin123"
              required /></label
          ><button class="primary-btn">Entrar no CMS</button>
          <p id="adminMsg" class="form-msg"></p>
        </form>
        <div class="demo-credentials">
          <strong>Acesso de teste</strong><span>admin@demo.com / admin123</span>
        </div>
      </section>
    </div>
    <div id="cms" class="cms hidden">
      <aside class="cms-sidebar">
        <div class="cms-logo">CMS <span>Notícias</span></div>
        <nav>
          <button class="active">▦ Notícias</button
          ><a href="../../index.html">↗ Ver portal</a>
        </nav>
        <button id="logoutAdmin" class="logout-btn">Sair</button>
      </aside>
      <main class="cms-main">
        <header class="cms-top">
          <div>
            <small>PAINEL ADMINISTRATIVO</small>
            <h1>Gerenciar notícias</h1>
          </div>
          <button id="newPostBtn" class="primary-btn">+ Nova notícia</button>
        </header>
        <section class="cms-stats">
          <div><b id="totalPosts">0</b><span>Notícias</span></div>
          <div><b id="totalImages">0</b><span>Com imagem</span></div>
          <div><b id="totalPublished">0</b><span>Publicadas</span></div>
        </section>
        <section class="cms-panel">
          <div class="panel-head">
            <h2>Conteúdo</h2>
            <input id="postSearch" placeholder="Buscar notícia..." />
          </div>
          <div id="postList" class="post-list"></div>
        </section>
      </main>
    </div>
    <div id="postModal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modalTitle">Nova notícia</h2>
          <button id="closeModal">×</button>
        </div>
        <form id="postForm">
          <input type="hidden" id="postId" />
          <div class="form-grid">
            <label class="span-2">Título<input id="postTitle" required /></label
            ><label
              >Categoria<select id="postCategory">
                <option>Brasil</option>
                <option>Norte</option>
                <option>Nordeste</option>
                <option>Centro-Oeste</option>
                <option>Sudeste</option>
                <option>Sul</option>
                <option>Economia</option>
                <option>Internacional</option>
                <option>Saúde</option>
                <option>Tecnologia</option>
                <option>Esportes</option>
                <option>Entretenimento</option>
              </select></label
            ><label
              >Status<select id="postStatus">
                <option value="published">Publicada</option>
                <option value="draft">Rascunho</option>
              </select></label
            ><label class="span-2"
              >Resumo<textarea id="postExcerpt" rows="3"></textarea></label
            ><label class="span-2"
              >URL da imagem<input
                id="postImage"
                type="url"
                placeholder="https://exemplo.com/imagem.jpg" /></label
            ><label class="span-2"
              >Link da notícia<input
                id="postLink"
                type="url"
                placeholder="https://exemplo.com/noticia"
            /></label>
          </div>
          <div id="imagePreview" class="image-preview">
            <span>Prévia da imagem</span>
          </div>
          <div class="modal-actions">
            <button type="button" id="cancelModal" class="secondary-btn">
              Cancelar</button
            ><button class="primary-btn">Salvar notícia</button>
          </div>
        </form>
      </div>
    </div>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/cms.js"></script>
    <script src="../../assets/js/animacoes.js"></script>
  </body>
</html>
